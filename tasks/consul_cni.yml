---
# File: consul_cni.yml - Consul CNI plugin installation tasks for Nomad

- name: Check Consul CNI package checksum file
  ansible.builtin.stat:
    path: "{{ role_path }}/files/nomad_consul_cni_{{ nomad_consul_cni_version }}_SHA256SUMS"
  become: false
  run_once: true
  tags: installation
  register: nomad_consul_cni_checksum
  delegate_to: 127.0.0.1

- name: Read installed Consul CNI version marker
  ansible.builtin.slurp:
    src: "{{ nomad_cni_dir }}/.ansible_consul_cni_version"
  register: nomad_consul_cni_version_marker
  changed_when: false
  failed_when: false
  tags: installation

- name: Calculate whether to install Consul CNI plugin
  ansible.builtin.set_fact:
    nomad_consul_cni_install: "{{ not (nomad_consul_cni_version_marker.content is defined and nomad_consul_cni_version_marker.content | b64decode == nomad_consul_cni_version | string) }}"
  tags: installation

- name: Get Nomad Consul CNI package checksum file
  ansible.builtin.get_url:
    url: "{{ nomad_consul_cni_checksum_file_url }}"
    dest: "{{ role_path }}/files/nomad_consul_cni_{{ nomad_consul_cni_version }}_SHA256SUMS"
    mode: "0644"
  become: false
  run_once: true
  tags: installation
  when: not nomad_consul_cni_checksum.stat.exists
  delegate_to: 127.0.0.1

- name: Get Nomad Consul CNI package checksum
  ansible.builtin.shell: |
    set -o pipefail
    grep "{{ nomad_consul_cni_pkg }}" "{{ role_path }}/files/nomad_consul_cni_{{ nomad_consul_cni_version }}_SHA256SUMS"  | awk '{print $1}'
  args:
    executable: /bin/bash
  become: false
  changed_when: false
  register: nomad_consul_cni_sha256
  tags: installation
  delegate_to: 127.0.0.1

- name: Check Nomad Consul CNI package file
  ansible.builtin.stat:
    path: "{{ role_path }}/files/{{ nomad_consul_cni_pkg }}"
  become: false
  register: nomad_consul_cni_package
  delegate_to: 127.0.0.1

- name: Download Nomad Consul CNI
  ansible.builtin.get_url:
    url: "{{ nomad_consul_cni_zip_url }}"
    dest: "{{ role_path }}/files/{{ nomad_consul_cni_pkg }}"
    checksum: "sha256:{{ nomad_consul_cni_sha256.stdout }}"
    timeout: "42"
    mode: "0644"
  become: false
  tags: installation
  delegate_to: 127.0.0.1
  when: not nomad_consul_cni_package.stat.exists

- name: Create Temporary Directory for Extraction
  ansible.builtin.tempfile:
    state: directory
    prefix: ansible-nomad.
  become: false
  register: install_temp
  tags: installation
  delegate_to: 127.0.0.1
  when: nomad_consul_cni_install | bool

- name: Unarchive Nomad Consul CNI
  ansible.builtin.unarchive:
    src: "{{ role_path }}/files/{{ nomad_consul_cni_pkg }}"
    dest: "{{ install_temp.path }}/"
    creates: "{{ install_temp.path }}/bridge"
    include:
      - "consul-cni"
  become: false
  tags: installation
  delegate_to: 127.0.0.1
  when: nomad_consul_cni_install | bool

- name: Install Nomad Consul CNI
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ nomad_cni_dir }}"
    owner: "{{ nomad_user }}"
    group: "{{ nomad_group }}"
    mode: "0755"
  loop: "{{ q('ansible.builtin.fileglob', install_temp.path ~ '/*') }}"
  tags: installation
  notify: Restart nomad
  when: nomad_consul_cni_install | bool

- name: Cleanup
  ansible.builtin.file:
    path: "{{ install_temp.path }}"
    state: absent
  become: false
  tags: installation
  delegate_to: 127.0.0.1
  when: nomad_consul_cni_install | bool

- name: Write Consul CNI version marker
  ansible.builtin.copy:
    content: "{{ nomad_consul_cni_version }}"
    dest: "{{ nomad_cni_dir }}/.ansible_consul_cni_version"
    owner: "{{ nomad_user }}"
    group: "{{ nomad_group }}"
    mode: "0644"
  tags: installation
  when: nomad_consul_cni_install | bool
