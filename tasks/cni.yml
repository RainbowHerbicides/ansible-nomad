---
# File: cni_plugin.yml - package installation tasks for Nomad CNI Plugin

- name: Create cni directory
  ansible.builtin.file:
    dest: "{{ nomad_cni_dir }}"
    state: directory
    owner: "{{ nomad_user }}"
    group: "{{ nomad_group }}"
    mode: "0750"

- name: Read installed CNI version marker
  ansible.builtin.slurp:
    src: "{{ nomad_cni_dir }}/.ansible_cni_version"
  register: nomad_cni_version_marker
  changed_when: false
  failed_when: false
  tags: installation

- name: Calculate whether to install CNI plugins
  ansible.builtin.set_fact:
    nomad_cni_install: "{{ not (nomad_cni_version_marker.content is defined and nomad_cni_version_marker.content | b64decode == nomad_cni_version | string) }}"
  tags: installation

- name: Check CNI package checksum file
  ansible.builtin.stat:
    path: "{{ role_path }}/files/nomad_cni_{{ nomad_cni_version }}_SHA256SUMS"
  become: false
  run_once: true
  tags: installation
  register: nomad_cni_checksum
  delegate_to: 127.0.0.1

- name: Get Nomad CNI package checksum file
  ansible.builtin.get_url:
    url: "{{ nomad_cni_checksum_file_url }}"
    dest: "{{ role_path }}/files/nomad_cni_{{ nomad_cni_version }}_SHA256SUMS"
    mode: "0640"
  become: false
  run_once: true
  tags: installation
  when: not nomad_cni_checksum.stat.exists
  delegate_to: 127.0.0.1

- name: Get Nomad CNI package checksum
  ansible.builtin.shell: |
    set -o pipefail
    grep "{{ nomad_cni_pkg }}" "{{ role_path }}/files/nomad_cni_{{ nomad_cni_version }}_SHA256SUMS"  | awk '{print $1}'
  args:
    executable: /bin/bash
  become: false
  changed_when: false
  register: nomad_cni_sha256
  tags: installation
  delegate_to: 127.0.0.1

- name: Check Nomad CNI package file
  ansible.builtin.stat:
    path: "{{ role_path }}/files/{{ nomad_cni_pkg }}"
  become: false
  register: nomad_cni_package
  delegate_to: 127.0.0.1

- name: Download Nomad CNI
  ansible.builtin.get_url:
    url: "{{ nomad_cni_zip_url }}"
    dest: "{{ role_path }}/files/{{ nomad_cni_pkg }}"
    mode: "0640"
    checksum: sha256:{{ nomad_cni_sha256.stdout }}
    timeout: "42"
  become: false
  tags: installation
  delegate_to: 127.0.0.1
  when: not nomad_cni_package.stat.exists

- name: Create Temporary Directory for Extraction
  ansible.builtin.tempfile:
    state: directory
    prefix: ansible-nomad.
  become: false
  register: install_temp
  tags: installation
  delegate_to: 127.0.0.1
  when: nomad_cni_install | bool

- name: Unarchive Nomad CNI
  ansible.builtin.unarchive:
    src: "{{ role_path }}/files/{{ nomad_cni_pkg }}"
    dest: "{{ install_temp.path }}/"
    creates: "{{ install_temp.path }}/bridge"
    exclude:
      - "README.md"
      - "LICENSE"
  become: false
  tags: installation
  delegate_to: 127.0.0.1
  when: nomad_cni_install | bool

- name: Install Nomad CNI
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ nomad_cni_dir }}"
    owner: "{{ nomad_user }}"
    group: "{{ nomad_group }}"
    mode: "0755"
  loop: "{{ q('ansible.builtin.fileglob', install_temp.path ~ '/*') }}"
  tags: installation
  notify: Restart nomad
  when: nomad_cni_install | bool

- name: Cleanup
  ansible.builtin.file:
    path: "{{ install_temp.path }}"
    state: absent
  become: false
  tags: installation
  delegate_to: 127.0.0.1
  when: nomad_cni_install | bool

- name: Write CNI version marker
  ansible.builtin.copy:
    content: "{{ nomad_cni_version }}"
    dest: "{{ nomad_cni_dir }}/.ansible_cni_version"
    owner: "{{ nomad_user }}"
    group: "{{ nomad_group }}"
    mode: "0644"
  tags: installation
  when: nomad_cni_install | bool
