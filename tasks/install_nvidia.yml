---
# File: install_nvidia.yml - package installation tasks for the Nomad
# NVIDIA device plugin (nomad-device-nvidia)

- name: Assert amd64 architecture for the NVIDIA device plugin
  ansible.builtin.assert:
    that:
      - nomad_architecture == 'amd64'
    fail_msg: >-
      The nomad-device-nvidia release publishes linux amd64 binaries
      only (arm64 builds are unreleased upstream).
  tags: installation

- name: Check Nomad NVIDIA package checksum file
  ansible.builtin.stat:
    path: "{{ role_path }}/files/nomad_nvidia_{{ nomad_nvidia_version }}_SHA256SUMS"
  become: false
  run_once: true
  tags: installation
  register: nomad_nvidia_checksum
  delegate_to: 127.0.0.1

- name: Read installed NVIDIA plugin version marker
  ansible.builtin.slurp:
    src: "{{ nomad_plugin_dir }}/.ansible_nvidia_version"
  register: nomad_nvidia_version_marker
  changed_when: false
  failed_when: false
  tags: installation

- name: Calculate whether to install NVIDIA plugin
  ansible.builtin.set_fact:
    nomad_nvidia_install: "{{ not (nomad_nvidia_version_marker.content is defined and nomad_nvidia_version_marker.content | b64decode == nomad_nvidia_version | string) }}"
  tags: installation

- name: Get Nomad NVIDIA package checksum file
  ansible.builtin.get_url:
    url: "{{ nomad_nvidia_checksum_file_url }}"
    dest: "{{ role_path }}/files/nomad_nvidia_{{ nomad_nvidia_version }}_SHA256SUMS"
    mode: "0640"
  become: false
  run_once: true
  tags: installation
  when: not nomad_nvidia_checksum.stat.exists
  delegate_to: 127.0.0.1

- name: Get Nomad NVIDIA package checksum
  ansible.builtin.shell: |
    set -o pipefail
    grep "{{ nomad_nvidia_pkg }}" "{{ role_path }}/files/nomad_nvidia_{{ nomad_nvidia_version }}_SHA256SUMS" | awk '{print $1}'
  args:
    executable: /bin/bash
  become: false
  changed_when: false
  register: nomad_nvidia_sha256
  tags: installation
  delegate_to: 127.0.0.1

- name: Check Nomad NVIDIA package file
  ansible.builtin.stat:
    path: "{{ role_path }}/files/{{ nomad_nvidia_pkg }}"
  become: false
  register: nomad_nvidia_package
  delegate_to: 127.0.0.1

- name: Download Nomad NVIDIA device plugin
  ansible.builtin.get_url:
    url: "{{ nomad_nvidia_zip_url }}"
    dest: "{{ role_path }}/files/{{ nomad_nvidia_pkg }}"
    mode: "0640"
    checksum: sha256:{{ nomad_nvidia_sha256.stdout }}
    timeout: "42"
  become: false
  tags: installation
  delegate_to: 127.0.0.1
  when: not nomad_nvidia_package.stat.exists

- name: Create Temporary Directory for Extraction
  ansible.builtin.tempfile:
    state: directory
    prefix: ansible-nomad.
  become: false
  register: install_temp
  tags: installation
  delegate_to: 127.0.0.1
  when: nomad_nvidia_install | bool

- name: Unarchive Nomad NVIDIA device plugin
  ansible.builtin.unarchive:
    src: "{{ role_path }}/files/{{ nomad_nvidia_pkg }}"
    dest: "{{ install_temp.path }}/"
    creates: "{{ install_temp.path }}/nomad-device-nvidia"
  become: false
  tags: installation
  delegate_to: 127.0.0.1
  when: nomad_nvidia_install | bool

- name: Install Nomad NVIDIA device plugin
  ansible.builtin.copy:
    src: "{{ install_temp.path }}/nomad-device-nvidia"
    dest: "{{ nomad_plugin_dir }}"
    owner: "{{ nomad_user }}"
    group: "{{ nomad_group }}"
    mode: "0755"
  tags: installation
  notify:
    - Restart nomad
  when: nomad_nvidia_install | bool

- name: Cleanup
  ansible.builtin.file:
    path: "{{ install_temp.path }}"
    state: absent
  become: false
  tags: installation
  delegate_to: 127.0.0.1
  when: nomad_nvidia_install | bool

- name: Write NVIDIA plugin version marker
  ansible.builtin.copy:
    content: "{{ nomad_nvidia_version }}"
    dest: "{{ nomad_plugin_dir }}/.ansible_nvidia_version"
    owner: "{{ nomad_user }}"
    group: "{{ nomad_group }}"
    mode: "0644"
  tags: installation
  when: nomad_nvidia_install | bool
