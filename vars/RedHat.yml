---
# File: vars/RedHat.yml - Red Hat OS variables for Nomad

nomad_os_packages:
  - "{% if (ansible_facts['distribution'] == 'AlmaLinux' and ansible_facts['distribution_version'] is version('9', '>=')) %}curl-minimal{% else %}curl{% endif %}"
  - git
  - "{% if (ansible_facts['distribution'] == 'Fedora' and ansible_facts['distribution_version'] is version('28', '<')) or (ansible_facts['distribution'] == 'CentOS' and
    ansible_facts['distribution_version'] is version('8', '<')) or (ansible_facts['distribution'] == 'Amazon' and ansible_facts['distribution_version'] is version('3', '<'))
    or (ansible_facts['distribution'] == 'OracleLinux' and ansible_facts['distribution_version'] is version('8', '<')) %}libselinux-python{% else %}python3-libselinux{% endif %}"
  - unzip
